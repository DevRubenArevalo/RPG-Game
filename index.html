<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slime Platformer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d1a;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      justify-content: center;
      gap: 12px;
    }

    .game-wrap {
      position: relative;
    }

    canvas {
      border: 2px solid #35d0ba;
      background: linear-gradient(#101830, #090d18 70%);
      width: min(95vw, 95vh * (1280 / 640));
      height: auto;
    }

    #status {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(5, 10, 30, 0.55);
      color: #35d0ba;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      font-family: Arial, sans-serif;
      pointer-events: none;
    }

    .hud {
      text-align: center;
      max-width: 1280px;
    }

    button {
      margin-top: 8px;
      padding: 6px 16px;
      border: 1px solid #35d0ba;
      background: transparent;
      color: #35d0ba;
      cursor: pointer;
    }

    button:hover {
      background: rgba(53, 208, 186, 0.15);
    }

    .shop,
    .pause-screen {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .shop.visible,
    .pause-screen.visible {
      pointer-events: auto;
      opacity: 1;
    }

    .shop-content,
    .pause-content {
      <div class="hud">
        <div class="hud-text">Arrows / A D move, Space jumps, S or ↓ ducks. Explore freely and leave acid trails to melt foes.</div>
        <button id="muteToggle">Mute Audio</button>
      </div>
      <div class="shop-grid">
      border: 2px solid #35d0ba;
      padding: 20px;
      max-width: 420px;
      color: #d9fef9;
      font-family: Arial, sans-serif;
    }

    .shop-intro {
      margin-bottom: 12px;
      text-align: center;
      color: #9eddd1;
    }

    .shop-grid {
      display: flex;
      flex-wrap: nowrap;
      gap: 12px;
      justify-content: center;
    }

    .shop-tile {
      background: #141f34;
      border: 1px solid #35d0ba;
      border-radius: 6px;
      padding: 14px;
      width: 110px;
      flex: 0 0 155px;
      min-width: 155px;
      max-width: 155px;
      text-align: center;
      color: #d8fff5;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .shop-tile:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
      background: #141f34;
    }

    .shop-tile h4 {
      margin: 8px 0 6px;
      font-size: 15px;
    }

    .shop-tile .cost {
      font-size: 13px;
      color: #89f6d8;
      margin: 4px 0;
    }

    .shop-tile .desc {
      font-size: 12px;
      color: #9bb0c5;
      margin: 0;
    }

    .tile-art {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      margin: 0 auto;
      border: 2px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .tile-art--regen {
      background: radial-gradient(circle at 30% 30%, #5dffba, #179a6f);
    }

    .tile-art--coins {
      background: radial-gradient(circle at 60% 40%, #ffd25d, #b87400);
    }

    .tile-art--maxhp {
      background: radial-gradient(circle at 40% 40%, #ff9ad7, #8340a8);
    }

    .tile-art::after,
    .tile-art::before {
      content: '';
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <canvas id="game" width="1280" height="640"></canvas>
    <div id="status"></div>
  </div>
  <div id="shopOverlay" class="shop hidden">
    <div class="shop-content">
      <h3>Slime Shop</h3>
      <p class="shop-intro">Choose a boon. Click its tile to infuse your slime.</p>
      <button id="shopRefresh" class="shop-refresh" type="button">Refresh Options (100 Coins)</button>
      <div id="shopTiles" class="shop-grid"></div>
      <p id="shopMessage"></p>
    </div>
  </div>
  <div id="pauseOverlay" class="pause-screen hidden">
    <div class="pause-content">
      <h3 style="text-align:center">Game Paused</h3>
      <div class="hud">
        <div class="hud-text">Arrows / A D move, Space jumps, S or ↓ ducks. Explore freely and leave acid trails to melt foes.</div>
        <button id="muteToggle">Mute Audio</button>
      </div>
      <div class="shop-grid">
        <button id="pauseContinue" class="shop-tile" type="button">
          <div class="tile-art tile-art--regen"></div>
          <h4>Continue</h4>
          <p class="desc">Resume the adventure (Esc).</p>
        </button>
        <button id="pauseRetry" class="shop-tile" type="button">
          <div class="tile-art tile-art--coins"></div>
          <h4>Retry</h4>
          <p class="desc">Restart from the safe zone.</p>
        </button>
      </div>
    </div>
  </div>
  <script type="module" src="./resources/js/main.js"></script>

</body>
</html>
